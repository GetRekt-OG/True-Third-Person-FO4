[Main]
; Hide weapon scene objects only while swimming; restore visibility afterward.
HideWeaponWhileSwimming=1
; Armed free-camera behavior for Fallout 4 1.11.240.0.
; Restart the game after changing this setting.
Enabled=1

; Face the firing direction during third-person gun hip fire. Restart to apply.
HipFireFacing=1

; Keep orbit after a completed holster; mouse look remains active.
KeepHolsterView=1
; Blend actor facing into firing and back to movement.
SmoothHipFire=1

[TargetLock]
; Melee weapons only. Middle-click toggles lock; V still switches POV.
; Middle-click cannot change POV while a melee weapon is drawn.
; The wheel uses normal zoom/POV controls when unlocked and switches targets when locked.
; While locked: move mouse horizontally, or wheel up=left / down=right.
Enabled=1
Distance=2000
Response=12
SwitchMousePixels=100

