[Main]
; Independent camera
Enabled=1
; 1 = with a gun out and ready (drawing, alert, shooting, aiming) use the game's
; own camera and movement; True Third Person takes over once the gun relaxes.
OnlyWhenRelaxed=0
HipFireHoldMs=1500
; Hip fire: how far (degrees) the upper body may twist toward the camera while the
; legs keep your move direction. 0 = turn the whole body to the camera instead.
TorsoTwistDegrees=60
; 1 = replace how long the gun stays raised after drawing or shooting before it
; drops to the relaxed pose (game setting fGunPlayerRelaxedWaitTime).
; 0 = leave the game's value alone.
CustomRelaxTime=1
; Seconds, 0.0 to 10.0. 0 = relaxed right after the draw.
RelaxTime=0.7

[TargetLock]
; Melee target lock
Enabled=1
; 1 = show target marker, 0 = hide it (target lock stays active)
ShowMarker=1
Distance=2000
Response=12
SwitchMousePixels=100
; Lock key. 0 = middle mouse, 1 = mouse 4, 2 = mouse 5, 3 = B, 4 = H, 5 = K, 6 = L,
; 7 = N, 8 = O, 9 = P, 10 = U, 11 = X, 12 = Y, 13 = Z, 14 = none
Key=0
; Controller lock button. 0 = right stick click, 1 = left stick click,
; 2 = right bumper, 3 = left bumper, 4 = A, 5 = B, 6 = X, 7 = Y,
; 8 = d-pad up, 9 = d-pad down, 10 = d-pad left, 11 = d-pad right, 12 = none
GamepadKey=0

[RangedTargetLock]
; Ranged target lock (guns). Aiming down sights pauses it. Keys as above.
Enabled=0
ShowMarker=1
Distance=3000
Response=12
SwitchMousePixels=100
Key=0
GamepadKey=0

[CameraOffset]
; Added to the game's shoulder camera position (fOverShoulder* settings), so they
; combine with the INI or other camera mods instead of replacing them: +40 here
; and -40 from another mod give 0. X = right, Y = forward, Z = up. -200 to 200.
HolsteredX=0
HolsteredZ=0
RangedX=0
RangedY=0
RangedZ=0
MeleeX=0
MeleeY=0
MeleeZ=0

[Controller]
; Third-person camera multipliers. 1.0 = unchanged; range 0.05 to 5.0.
; Holstered
Y-Axis Sensitivity=0.5
X-Axis Sensitivity=1.0
; Weapon drawn
Drawn Y-Axis Sensitivity=0.45
Drawn X-Axis Sensitivity=1.0
; Aiming down sights
ADS Y-Axis Sensitivity=0.8
ADS X-Axis Sensitivity=1.0

[MouseKeyboard]
; Third-person camera multipliers. 1.0 = unchanged; range 0.05 to 5.0.
; Holstered
Y-Axis Sensitivity=1.0
X-Axis Sensitivity=1.0
; Weapon drawn
Drawn Y-Axis Sensitivity=1.0
Drawn X-Axis Sensitivity=1.0
; Aiming down sights
ADS Y-Axis Sensitivity=1.0
ADS X-Axis Sensitivity=1.0

[Debug]
; 1 = every 5 seconds, write how much time TTP's own code takes per frame to
; %TEMP%\TrueThirdPerson-startup.log. Use it to check whether TTP affects FPS.
Profile=0
; 1 = for 1.5 s after each weapon draw, write per-frame movement (stick, body,
; camera, actual movement direction, sideways drift) to the same log.
DrawTrace=0
; -1 = turn the hip-fire torso twist the other way (only if it turns away from
; the crosshair).
TwistSign=1
